{% extends "base.html" %}
{% block content %}
<h2>Delete Post?</h2>
<p>Are you sure you want to delete "<strong>{{ post.title }}</strong>"? This cannot be undone.</p>

<form method="POST" action="{{ url_for('posts.delete_post', post_id=post.id) }}">
  <a href="{{ url_for('posts.post', post_id=post.id) }}" class="btn btn-secondary">Cancel</a>
  <button type="submit" class="btn btn-danger">Delete</button>
</form>
{% endblock %}
